<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>учёт финансов</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Финансы">
<meta name="theme-color" content="#f9f9f7">
<style>
:root{--bg:#f9f9f7;--card:#fff;--ink:#0b0b0b;--mute:#8e8e93;--chip:#efeeea;--hero:#0b0b0b;--heroink:#fff;--line:#ecebe7;--pos:#1a9e5c;--neg:#e5383b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--ink:#f5f5f5;--mute:#8e8e93;--chip:#232326;--hero:#2c2c30;--line:#2a2a2d;--pos:#4cd68a;--neg:#ff5a5d}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--ink:#f5f5f5;--mute:#8e8e93;--chip:#232326;--hero:#2c2c30;--line:#2a2a2d;--pos:#4cd68a;--neg:#ff5a5d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'SF Pro Display',system-ui,'Segoe UI',sans-serif;font-weight:500;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:18px 16px 48px}
.a{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0)*80ms)}
@keyframes up{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.mt{position:relative}
.mt h1{margin:0;font-size:36px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.mt h1 svg{width:18px;height:18px}
.mt span{color:var(--mute);font-size:20px;font-weight:700}
.mt select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.rb{width:50px;height:50px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;transition:transform .2s}
.rb:active{transform:scale(.92)}
.rb svg{width:22px;height:22px}
.hero{background:var(--hero);color:var(--heroink);border-radius:38px;padding:26px 28px 24px;margin-bottom:14px}
.lb{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:#8e8e93;font-weight:700}
.big{font-size:52px;font-weight:800;letter-spacing:-1px;margin:6px 0 18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero hr{border:0;border-top:1px solid rgba(255,255,255,.14);margin:0 0 18px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cols b{display:block;font-size:17px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cols .lb{font-size:12px;letter-spacing:1.6px}
.card{background:var(--card);border-radius:30px;padding:20px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:18px;font-weight:800}
.cv{position:relative;height:220px}
.lg{margin:12px 0 0;padding:0;list-style:none}
.lg li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:16px}
.lg i{width:12px;height:12px;border-radius:50%;flex:none}
.lg span{flex:1}
.lg b{font-weight:800}
.chips{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 6px;padding:2px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:14px 22px;background:var(--chip);color:var(--mute);font:700 18px -apple-system,system-ui,sans-serif;transition:background .25s,color .25s,transform .2s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:var(--bg)}
.dh{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:20px 6px 10px}
.dh small{color:var(--mute);font-size:15px;font-weight:700;align-self:center}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:28px;padding:12px 18px 12px 12px;margin-bottom:8px}
.ic{width:56px;height:56px;border-radius:18px;background:var(--chip);display:grid;place-items:center;font-size:22px;font-weight:800;color:var(--mute);flex:none}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{color:var(--mute);font-size:15px;font-weight:600}
.am{font-size:19px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.am.p{color:var(--pos)}.am.n{color:var(--neg)}.rbs{display:flex;gap:8px}.rbs .rb{width:44px;height:44px}.row{cursor:pointer}.sh{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}.sv{position:absolute;inset:0;background:rgba(0,0,0,.5);animation:fd .3s}.spn{position:relative;width:100%;max-width:520px;max-height:86vh;overflow:auto;background:var(--bg);border-radius:34px 34px 0 0;padding:12px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:sl .5s cubic-bezier(.2,.9,.2,1)}.spn .pick{border:0;margin-top:6px}.gr{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}@keyframes sl{from{transform:translateY(100%)}to{transform:none}}@keyframes fd{from{opacity:0}to{opacity:1}}.pr{margin:16px 0}.pt{display:flex;justify-content:space-between;font-size:17px;font-weight:700;margin-bottom:7px}.pt b{font-weight:800}.bt{height:10px;border-radius:99px;background:var(--chip);overflow:hidden}.bf{height:100%;width:0;border-radius:99px;background:var(--ink);transition:width 1s cubic-bezier(.2,.8,.2,1)}.sp2{height:1px;background:var(--line);margin:18px 0 6px}.rc{margin:0 0 16px;background:var(--card);border-radius:24px;padding:20px;font:14px/1.6 ui-monospace,'SF Mono',Menlo,monospace;white-space:pre-wrap;word-break:break-word;color:var(--ink)}.cr{text-align:center;color:var(--mute);font-size:14px;font-weight:700;margin:18px 0 0}
.pick{display:block;width:100%;padding:15px;border-radius:18px;background:var(--ink);color:var(--bg);font:800 17px -apple-system,system-ui,sans-serif;text-align:center}
textarea{width:100%;height:84px;margin-top:10px;border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);padding:12px;font:16px -apple-system,system-ui,sans-serif}
.hide{display:none}
.mu{text-align:center;color:var(--mute);padding:10px;font-size:15px}
@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}
.lg2{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:14px;font-weight:700;color:var(--mute)}.lg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}.tx{font:700 11px -apple-system,system-ui,sans-serif;fill:var(--mute)}.bar{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:gr .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0ms)}@keyframes gr{to{transform:scaleY(1)}}.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dl 1.4s cubic-bezier(.2,.8,.2,1) .2s forwards}@keyframes dl{to{stroke-dashoffset:0}}.fa{animation:fi 1s .5s both}@keyframes fi{from{opacity:0}}@media (prefers-reduced-motion:reduce){.bar{animation:none;transform:none}.ln{animation:none;stroke-dashoffset:0}.fa{animation:none}}
</style>
</head>
<body>
<main>
<header class="hd a">
  <div class="mt"><h1><span style="color:inherit;font-size:inherit;font-weight:inherit" id="mt">Учёт</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></h1><span id="yr"></span><select id="ms" aria-label="месяц"></select></div>
  <div class="rbs"><button class="rb" id="pb" aria-label="проценты"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5L5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg></button><button class="rb" id="tb" aria-label="тема"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button class="rb" id="ib" aria-label="загрузить данные"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 14h6M9 17h4"/></svg></button></div>
</header>
<div id="app">
  <div class="hero a" style="--i:1">
    <div class="lb">остаток</div>
    <div class="big" id="kB">0</div>
    <hr>
    <div class="cols"><div><div class="lb">доходы</div><b id="kI">0</b></div><div><div class="lb">расходы</div><b id="kE">0</b></div><div><div class="lb">отложено</div><b id="kS">0</b></div></div>
  </div>
  <section class="card a" style="--i:2"><h2>расходы по категориям</h2><div class="cv"><div id="c1" style="height:100%"></div></div><ul class="lg" id="lg"></ul></section>
  <div class="chips a" id="chips" style="--i:3"></div>
  <div id="lst"></div>
  <section class="card a" style="--i:4"><h2>доходы и расходы по месяцам</h2><div class="cv"><div id="c2" style="height:100%"></div></div><div class="lg2"><span><i style="background:var(--ink)"></i>доход</span><span><i style="background:var(--mute)"></i>расход</span></div></section>
  <section class="card a" style="--i:5"><h2>накопления</h2><div class="cv"><div id="c3" style="height:100%"></div></div></section>
</div>
<section id="imp" class="card hide">
  <label class="pick">выбрать чек<input id="file" type="file" accept=".txt,.csv,text/plain" hidden></label>
</section>
<p id="st" class="mu"></p>
<p class="cr">sixteendope ©</p>
</main>
<div id="sh" class="sh hide"><div class="sv" id="sv"></div><div class="spn"><div class="gr"></div><div id="sc"></div><button class="pick" id="sx">закрыть</button></div></div>
<script>
const $=s=>document.querySelector(s);
const MN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
let PAL=[];const dk=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
const TN={i:'доход',e:'расход',s:'накопления',w:'из накоплений'};
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const cap=s=>s[0].toUpperCase()+s.slice(1);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>n.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' Br';
let rows=[],months=[],mi=0,cat='',charts={},first=true;
function dec(h){try{h=decodeURIComponent(h).replace(/\s/g,'').replace(/-/g,'+').replace(/_/g,'/');return new TextDecoder().decode(Uint8Array.from(atob(h),c=>c.charCodeAt(0)))}catch(e){return ''}}
function pd(s){let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],m[2]-1,+m[3]);m=s.match(/(\d{1,2})\s+([а-яё]+)\.?\s+(\d{4})/i);if(m){const P=['янв','фев','мар','апр','ма','июн','июл','авг','сен','окт','ноя','дек'];const k=P.findIndex(p=>m[2].toLowerCase().startsWith(p));if(k>=0)return new Date(+m[3],k,+m[1])}m=s.match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,m[2]-1,+m[1])}return null}
function parse(t){
  const out=[];
  t.split(/ЧЕК ОБ ОПЛАТЕ/i).forEach((b,n)=>{
    const d=pd(b);if(!d)return;
    let type=null;
    b.split(/\r?\n/).some(l=>{const w=l.replace(/[^а-яёa-z\s]/gi,'').trim().toLowerCase();const x=w.match(/^(доход|расход|накоп|взять)/);if(x){type=x[1]==='доход'?'i':x[1]==='расход'?'e':x[1]==='взять'?'w':'s';return true}});
    const a=b.match(/(\d[\d\s]*(?:[.,]\d+)?)\s*BYN/i);
    if(!type||!a)return;
    const v=parseFloat(a[1].replace(/\s/g,'').replace(',','.'));if(isNaN(v))return;
    const fx=z=>z.replace(/макетплейс/gi,'маркетплейс');const c=fx(((b.match(/категория:[ \t]*([^\n\r]*)/i)||[])[1]||'').trim());
    const s=fx(((b.match(/источник:[ \t]*([^\n\r]*)/i)||[])[1]||'').trim());
    const ls=b.split(/\r?\n/);const di=ls.findIndex(l=>l.trim()&&/^[\s\u{1D100}-\u{1D1FF}]+$/u.test(l));const deco=di>=0?ls[di].trim():'';const body=(di>=0?ls.slice(0,di):ls).join('\n').trim();const raw=(deco?deco+'\n\n':'')+'ЧЕК ОБ ОПЛАТЕ\n\n'+body+(deco?'\n\n'+deco:'');out.push({d,type,v,n,raw,cat:type==='e'?(c||'без категории'):c,title:c||s||TN[type]});
  });
  return out;
}
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const sum=(a,t)=>a.filter(r=>r.type===t).reduce((s,r)=>s+r.v,0);
function cnt(el,v,delay){if(RM){el.textContent=f(v);return}el.textContent=f(0);setTimeout(()=>{const t0=performance.now();(function s(t){const p=Math.min((t-t0)/1000,1),e=1-Math.pow(1-p,3);el.textContent=f(v*e);if(p<1)requestAnimationFrame(s)})(t0)},delay)}
function mk(id,cfg){if(charts[id])charts[id].destroy();charts[id]=new Chart($(id),cfg)}
function load(t){
  rows=parse(t);
  const L=t.trim();
  $('#st').textContent=L?('прочитано чеков: '+rows.length+(rows.length?'':'. не смог разобрать формат, начало файла: '+L.slice(0,60))):'';
  months=[...new Set(rows.map(r=>key(r.d)))].sort();
  const cur=key(new Date());
  mi=months.includes(cur)?months.indexOf(cur):months.length-1;
  $('#ms').innerHTML=months.map((m,i)=>`<option value="${i}">${cap(MN[+m.split('-')[1]-1])} ${m.split('-')[0]}</option>`).join('');
  render();
}
function render(){
  const has=rows.length>0;
  $('#app').classList.toggle('hide',!has);
  if(!has){$('#imp').classList.remove('hide');$('#mt').textContent='Учёт';$('#yr').textContent='';return}
  const m=months[mi],[y,mo]=m.split('-');
  $('#mt').textContent=cap(MN[+mo-1]);$('#yr').textContent=y;$('#ms').value=mi;
  const cur=rows.filter(r=>key(r.d)===m);
  const I=sum(cur,'i'),E=sum(cur,'e'),S=sum(cur,'s'),W=sum(cur,'w');
  cnt($('#kB'),I-E-S+W,350);cnt($('#kI'),I,450);cnt($('#kE'),E,550);cnt($('#kS'),S-W,650);
  cat='';PAL=dk()?['#f5f5f5','#c8c8cc','#9a9aa0','#6e6e73','#48484c','#303034']:['#0b0b0b','#3a3a3c','#636366','#8e8e93','#aeaeb2','#d1d1d6'];
  const cats={};cur.filter(r=>r.type==='e').forEach(r=>cats[r.cat]=(cats[r.cat]||0)+r.v);
  const ce=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  $('#lg').innerHTML=ce.length?ce.map((c,i)=>`<li><i style="background:${PAL[i%PAL.length]}"></i><span>${esc(c[0])}</span><b>${f(c[1])}</b></li>`).join(''):'<li><span style="color:var(--mute)">расходов в этом месяце нет</span></li>';
  $('#chips').innerHTML=['Все',...ce.map(c=>c[0])].map((c,i)=>`<button class="chip${i?'':' on'}" data-c="${i?esc(c):''}">${esc(cap(c))}</button>`).join('');
  list();
  const sh=months.map(x=>MN[+x.split('-')[1]-1].slice(0,3));
  const C=2*Math.PI*70,tot=ce.reduce((a,c)=>a+c[1],0);let off=0;
  $('#c1').innerHTML='<svg viewBox="0 0 200 200" style="height:100%;display:block;margin:auto"><g transform="rotate(-90 100 100)">'+(tot?ce.map((c,i)=>{const L=Math.max(c[1]/tot*C-(ce.length>1?4:0),1),o=off;off+=c[1]/tot*C;return `<circle cx="100" cy="100" r="70" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="28" stroke-dasharray="0 ${C}" stroke-dashoffset="${-o}" data-d="${L} ${C-L}" style="transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1) ${i*120}ms"/>`}).join(''):'<circle cx="100" cy="100" r="70" fill="none" stroke="var(--chip)" stroke-width="28"/>')+'</g></svg>';
  setTimeout(()=>document.querySelectorAll('#c1 circle[data-d]').forEach(e=>e.style.strokeDasharray=e.dataset.d),60);
  const iv=months.map(x=>sum(rows.filter(r=>key(r.d)===x),'i')),ev=months.map(x=>sum(rows.filter(r=>key(r.d)===x),'e'));
  const mx=Math.max(1,...iv,...ev),sl=300/months.length,bw=Math.min(24,sl/3);
  const bar=(x,v,fill,d)=>{const h=v>0?Math.max(v/mx*150,3):0;return `<rect class="bar" x="${x}" y="${160-h}" width="${bw}" height="${h}" rx="6" fill="${fill}" style="--d:${d}ms"/>`};
  $('#c2').innerHTML='<svg viewBox="0 0 300 190" style="width:100%;height:100%"><line x1="0" y1="160.5" x2="300" y2="160.5" stroke="var(--line)"/>'+months.map((x,i)=>{const cx=sl*(i+.5);return bar(cx-bw-1,iv[i],'var(--ink)',i*90)+bar(cx+1,ev[i],'var(--mute)',i*90+60)+`<text class="tx" x="${cx}" y="180" text-anchor="middle">${sh[i]}</text>`}).join('')+'</svg>';
  let acc=0;const sv=months.map(x=>{const a=rows.filter(r=>key(r.d)===x);acc+=sum(a,'s')-sum(a,'w');return acc});
  const lo=Math.min(0,...sv),hi=Math.max(1,...sv),px=i=>months.length>1?24+i*252/(months.length-1):150,py=v=>150-(v-lo)/(hi-lo)*120;
  const pts=sv.map((v,i)=>[px(i),py(v)]),dd='M'+pts.map(p=>p.join(' ')).join(' L');
  $('#c3').innerHTML='<svg viewBox="0 0 300 190" style="width:100%;height:100%"><line x1="0" y1="160.5" x2="300" y2="160.5" stroke="var(--line)"/><path class="fa" d="'+dd+' L'+pts[pts.length-1][0]+' 160 L'+pts[0][0]+' 160Z" fill="var(--chip)"/><path class="ln" pathLength="1" d="'+dd+'" fill="none" stroke="var(--mute)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+pts.map((p,i)=>`<circle class="fa" cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--mute)"/><text class="tx" x="${p[0]}" y="180" text-anchor="middle">${sh[i]}</text>`).join('')+'</svg>';
}
function list(){
  const cur=rows.filter(r=>key(r.d)===months[mi]&&(!cat||r.cat===cat)).sort((a,b)=>b.d-a.d||b.n-a.n);
  const g=new Map();cur.forEach(r=>{const k=r.d.getTime();if(!g.has(k))g.set(k,[]);g.get(k).push(r)});
  let n=0;
  $('#lst').innerHTML=[...g].map(([k,a])=>{
    const d=new Date(k);
    return `<div class="dh a" style="--i:${Math.min(4+n++,14)}">${d.getDate()} ${MG[d.getMonth()]}</div>`+a.map(r=>`<div class="row a" data-n="${r.n}" style="--i:${Math.min(4+n++,14)}"><div class="ic">${esc(cap(r.title)[0])}</div><div class="rt"><b>${esc(cap(r.title))}</b><small>${TN[r.type]}</small></div><div class="am${r.type==='i'?' p':r.type==='e'?' n':''}">${r.type==='i'?'+':r.type==='e'?'\u2212':''}${f(r.v)}</div></div>`).join('');
  }).join('');
}
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));list()};
$('#ms').onchange=e=>{mi=+e.target.value;render()};
try{const th=localStorage.getItem('th');if(th)document.documentElement.dataset.theme=th}catch(e){}
$('#tb').onclick=()=>{const n=dk()?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('th',n)}catch(e){}if(rows.length)render()};
$('#ib').onclick=()=>$('#imp').classList.toggle('hide');
function sheet(h){$('#sc').innerHTML=h;$('#sh').classList.remove('hide');document.body.style.overflow='hidden'}
function shut(){$('#sh').classList.add('hide');document.body.style.overflow=''}
$('#sv').onclick=shut;$('#sx').onclick=shut;
$('#lst').onclick=e=>{const el=e.target.closest('.row');if(!el)return;const r=rows.find(x=>String(x.n)===el.dataset.n);if(r)sheet('<pre class="rc">'+esc(r.raw)+'</pre>')};
function pct(){
  const m=months[mi],cur=rows.filter(r=>key(r.d)===m);
  const I=sum(cur,'i'),E=sum(cur,'e'),S=sum(cur,'s')-sum(cur,'w');
  const base=I>0?I:E;
  const p=v=>base?(v/base*100).toFixed(1).replace('.',',')+'%':'0%';
  const rw=(n,v)=>`<div class="pr"><div class="pt"><span>${esc(n)}</span><b>${p(v)}</b></div><div class="bt"><div class="bf" data-w="${base?Math.max(0,Math.min(v/base*100,100)):0}"></div></div></div>`;
  const cats={};cur.filter(r=>r.type==='e').forEach(r=>cats[r.cat]=(cats[r.cat]||0)+r.v);
  let h='<h2>траты в процентах от дохода</h2><p class="mu" style="text-align:left;padding:0 0 4px">'+MN[+m.split('-')[1]-1]+' '+m.split('-')[0]+'</p>';
  if(!I)h+='<p class="mu" style="text-align:left;padding:0">в этом месяце нет доходов, поэтому считаю от всех расходов</p>';
  h+=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(c=>rw(c[0],c[1])).join('')||'<p class="mu">расходов нет</p>';
  if(I)h+='<div class="sp2"></div>'+rw('расходы всего',E)+rw('отложено',S)+rw('осталось',I-E-S);
  sheet(h);setTimeout(()=>document.querySelectorAll('.bf').forEach(e=>e.style.width=e.dataset.w+'%'),60);
}
$('#pb').onclick=()=>{if(rows.length)pct()};
function use(t){try{localStorage.setItem('fin',t)}catch(e){}load(t)}
$('#file').onchange=e=>{const r=e.target.files[0];if(r)r.text().then(use)};
let t=location.hash.length>1?dec(location.hash.slice(1)):'';
if(!t){try{t=localStorage.getItem('fin')||''}catch(e){}}
else{try{localStorage.setItem('fin',t)}catch(e){}}
load(t);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
